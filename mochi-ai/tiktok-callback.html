<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok sign-in — Mochi AI</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #221A4E; color: #f5f2ff; line-height: 1.6; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 20px 64px; }
  h1 { color: #FFC53D; font-size: 1.8rem; margin: 0 0 16px; }
  a { color: #FFC53D; }
  .box { background: #2E2566; border-radius: 12px; padding: 20px 24px; margin: 16px 0; word-break: break-all; }
  .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.95rem; }
  button { background: #FFC53D; color: #221A4E; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  button:hover { opacity: 0.9; }
  .note { color: #a99fd6; font-size: 0.95rem; }
  footer { margin-top: 40px; font-size: 0.9rem; color: #a99fd6; }
</style>
</head>
<body>
<main>
  <h1 id="heading">TikTok sign-in</h1>
  <div id="content"><p>Finishing the sign-in…</p></div>
  <p class="note">This page is the sign-in landing page for the Mochi AI TikTok app. It does not send your authorization code anywhere — the code is shown here only so it can be copied to finish connecting the @mochi.knows.ai account.</p>
  <footer><a href="index.html">&larr; Back to Mochi AI</a> &middot; &copy; 2026 Mochi AI</footer>
</main>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  var error = params.get('error');
  var errorDescription = params.get('error_description');
  var heading = document.getElementById('heading');
  var content = document.getElementById('content');

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
    });
  }

  if (code) {
    heading.textContent = 'Sign-in complete';
    content.innerHTML =
      '<p>Your TikTok authorization code is below. Copy it and give it to Mochi AI to finish connecting the @mochi.knows.ai account. The code expires within minutes, so use it right away.</p>' +
      '<div class="box"><span class="code" id="code">' + escapeHtml(code) + '</span></div>' +
      '<p><button id="copy">Copy code</button> <span id="copied"></span></p>';
    document.getElementById('copy').addEventListener('click', function () {
      var text = document.getElementById('code').textContent;
      var done = function () { document.getElementById('copied').textContent = 'Copied.'; };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () { window.prompt('Copy the code:', text); });
      } else {
        window.prompt('Copy the code:', text);
      }
    });
  } else if (error) {
    heading.textContent = 'Sign-in was not completed';
    content.innerHTML = '<p>TikTok returned an error: <strong>' + escapeHtml(error) + '</strong>' +
      (errorDescription ? ' — ' + escapeHtml(errorDescription) : '') + '</p>' +
      '<p>Please try signing in again.</p>';
  } else {
    heading.textContent = 'TikTok sign-in';
    content.innerHTML = '<p>No authorization code was provided. If you arrived here from TikTok, please try the sign-in again.</p>';
  }
})();
</script>
</body>
</html>
